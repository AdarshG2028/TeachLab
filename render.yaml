# Render Blueprint: one Docker web service running the API *and* the job worker in a single process.
# Render > New > Blueprint > pick this repo, then fill the secrets marked `sync: false`.
#
# Plan note: the embedding model runs on ONNX (no PyTorch). Measured for this image under a hard 512 MB limit:
# idle 312 MiB, peak 464 MiB during a roadmap + lesson + 5-PDF teaching pack, no out-of-memory kill. So the $7
# "starter" (512 MB) plan works but has little headroom; if the dashboard shows OOM restarts, switch the plan to
# "standard" (2 GB). Free plans sleep when idle, which stops background jobs, so they are not suitable.
services:
  - type: web
    name: teachlab-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - { key: ENV, value: production }
      - { key: LOG_JSON, value: "true" }
      - { key: AUTH_PROVIDER, value: anonymous }
      - { key: RUN_WORKER_IN_API, value: "true" }
      - { key: STORAGE_BACKEND, value: postgres }
      - { key: WORKER_CONCURRENCY, value: "1" }   # one job at a time keeps peak memory low
      - { key: MALLOC_ARENA_MAX, value: "2" }
      - { key: LLM_PROVIDER, value: groq }
      - { key: SEARCH_PROVIDER, value: exa }
      - { key: LLM_MODEL_SMART, value: openai/gpt-oss-120b }
      - { key: LLM_MODEL_FAST, value: openai/gpt-oss-20b }
      - { key: LLM_TOKENS_PER_MINUTE, value: "8000" }
      # protect your API quota from anonymous visitors
      - { key: DAILY_JOB_LIMIT_PER_USER, value: "40" }
      - { key: DAILY_JOB_LIMIT_GLOBAL, value: "400" }
      - { key: MAX_WORKSPACES_PER_USER, value: "10" }
      # secrets and URLs: set these in the Render dashboard
      - { key: DATABASE_URL, sync: false }        # Neon / Supabase / Render Postgres connection string
      - { key: QDRANT_URL, sync: false }          # https://<cluster>.cloud.qdrant.io:6333
      - { key: QDRANT_API_KEY, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: EXA_API_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }        # your Vercel URL, e.g. https://teachlab.vercel.app
