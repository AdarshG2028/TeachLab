# Production stack for a single EC2 instance: the API (with the job worker inside) behind Caddy, which
# terminates HTTPS and gets/renews a Let's Encrypt certificate automatically.
#
#   cd ~/teachlab/deploy/ec2 && cp env.example .env && nano .env && docker compose up -d --build
services:
  api:
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    mem_limit: 750m          # leave room for the OS, Docker and Caddy on a 1 GB instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
