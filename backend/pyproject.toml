[project]
name = "teachlab-backend"
version = "0.1.0"
description = "AI research, teaching-preparation and assessment platform for teachers (backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.28",
    "openai>=1.55",
    "sentence-transformers>=3.3",
    "qdrant-client>=1.12",
    "neo4j>=5.26",
    "trafilatura>=2.0",
    "pypdf>=5.1",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "markdown-it-py>=3.0",
    "pygments>=2.18",
    "tiktoken>=0.8",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real external APIs (Groq/Tavily); requires keys",
    "integration: requires docker services (postgres, neo4j, qdrant)",
    "nodb: pure unit test, no services needed",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "UP047", "ASYNC109"]
